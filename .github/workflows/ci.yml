name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync

      - name: Lint
        run: uv run ruff check .

      # Fails when a file is not formatted, without rewriting anything here.
      - name: Check formatting
        run: uv run ruff format --check .

  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # setup-uv publishes exact version tags only, no floating major tag.
      - name: Set up uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true

      # uv reads .python-version and installs the interpreter itself.
      # The default sync includes the dev group, so pytest comes with it.
      # The sql group brings duckdb, which the SQL parity tests need; without
      # it those tests skip instead of running.
      - name: Install dependencies
        run: uv sync --group sql

      - name: Run tests
        run: uv run pytest tests/ -v

  # The daily workflow installs with a bare `uv sync`, so something has to prove
  # ingestion still runs in that environment. The test job cannot: it needs the
  # sql group for duckdb, and an import that only resolves there would pass CI
  # and break the 05:00 run. This job is that guarantee, and it is why pandas is
  # a direct dependency rather than one inherited from pydataxm.
  ingest-smoke:
    name: Ingestion on a bare install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true

      - name: Install core dependencies only
        run: uv sync --no-default-groups

      - name: Check ingestion CLI
        run: uv run python -m forecast_energy.ingest --help
