[project]
name = "forecast-energy-stockchange-colombia"
version = "0.1.0"
description = "Forecasting Colombia's hourly wholesale electricity spot price (precio de bolsa) from public SIMEM/XM data"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Daniel Felipe Sacristan", email = "sacristandanielfelipe@gmail.com" }]
requires-python = ">=3.13,<3.14"
dependencies = [
    "pandas>=2.3.3",
    "pyarrow>=24.0.0",
    "pydataxm>=0.3",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.0",
]
eda = [
    "numpy",
    "matplotlib",
    "scipy",
    "statsmodels",
]
mlops = [
    "scikit-learn",
    "mlflow",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# E/W pycodestyle, F pyflakes (real bugs: unused names, undefined vars),
# I import sorting, UP syntax modernization, B likely-bug patterns,
# SIM redundant constructs.
select = ["E", "W", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# Exploratory notebooks import what the session will need, not only what the
# current cell uses, and import where the narrative calls for it.
"notebooks/*.ipynb" = ["F401", "E402"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/forecast_energy"]
