[project]
name = "forecast-energy-stockchange-colombia"
version = "0.1.0"
description = "Forecasting Colombia's hourly wholesale electricity spot price (precio de bolsa) from public SIMEM/XM data"
readme = "README.md"
authors = [{ name = "Daniel Felipe Sacristan", email = "sacristandanielfelipe@gmail.com" }]
requires-python = ">=3.13,<3.14"
dependencies = [
    "pandas>=2.3.3",
    "pyarrow>=24.0.0",
    "pydataxm>=0.3",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
eda = [
    "numpy",
    "matplotlib",
    "scipy",
    "statsmodels",
]
mlops = [
    "scikit-learn",
    "mlflow",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/forecast_energy"]
